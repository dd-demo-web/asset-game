<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Quest Quiz Game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <h1 id="title">Asset Quiz</h1>
    <div id="hud">
      <span id="score-display">Punteggio: 0</span>
      <span id="level-display">Livello 1/3</span>
      <span id="topic-display"></span>
    </div>
    <canvas id="game" width="800" height="500"></canvas>
    <p id="hint-keyboard" class="hint">Muoviti con le frecce o WASD, premi <b>E</b> per parlare/leggere.</p>
    <p id="hint-touch" class="hint">Tocca lo schermo per spostarti e tocca un personaggio o una bacheca per raggiungerlo.</p>
  </div>

  <!-- Dialog / Question modal -->
  <div id="quiz-modal" class="hidden">
    <div id="quiz-box">
      <button id="quiz-close-btn" aria-label="Chiudi la conversazione" title="Chiudi">&times;</button>
      <p id="npc-name"></p>
      <p id="question-text"></p>
      <div id="answers"></div>
      <p id="feedback"></p>
    </div>
  </div>

  <!-- Documentation board modal (approfondimenti) -->
  <div id="doc-modal" class="hidden">
    <div id="doc-box">
      <button id="doc-close-btn" aria-label="Chiudi la documentazione" title="Chiudi">&times;</button>
      <h2 id="doc-title"></h2>
      <p id="doc-body"></p>
    </div>
  </div>

  <!-- Level complete modal -->
  <div id="level-modal" class="hidden">
    <div id="level-box">
      <h2>Livello completato!</h2>
      <p id="level-complete-text"></p>
      <button id="next-level-btn">Livello successivo</button>
    </div>
  </div>

  <div id="end-modal" class="hidden">
    <div id="end-box">
      <h2>Quiz completato!</h2>
      <p id="final-score"></p>
      <button id="restart-btn">Ricomincia</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
